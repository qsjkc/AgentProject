name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Deployment branch (only main is accepted)
        required: false
        default: main

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Preflight
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      docker_enabled: ${{ steps.vars.outputs.docker_enabled }}
      server_enabled: ${{ steps.vars.outputs.server_enabled }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Keep public source SHAs out of job outputs, which secret filtering can suppress.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve deployment variables
        id: vars
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          GH_TOKEN: ${{ github.token }}
          SERVER_PORT_SECRET: ${{ secrets.SERVER_PORT }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail

          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$(git rev-parse HEAD)" != "$MAIN_SHA" ]]; then
            echo 'main moved during preflight; rerun against its successful CI' >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "${INPUT_REF:-main}" != "main" || "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo 'Manual deployment only accepts the main branch' >&2
              exit 1
            fi
            SUCCESSFUL_CI="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$MAIN_SHA" -f branch=main -f status=success -f per_page=100 \
              --jq '[.workflow_runs[] | select(.head_sha == "'"$MAIN_SHA"'" and .head_branch == "main" and (.event == "push" or .event == "workflow_dispatch") and .conclusion == "success")] | length')"
            if [[ "$SUCCESSFUL_CI" -eq 0 ]]; then
              echo 'Current main has no successful CI; refusing deployment' >&2
              exit 1
            fi
          elif [[ "$WORKFLOW_BRANCH" != "main" || "$WORKFLOW_SHA" != "$MAIN_SHA" \
            || ( "$WORKFLOW_EVENT" != "push" && "$WORKFLOW_EVENT" != "workflow_dispatch" ) ]]; then
            echo 'Automatic deployment requires successful CI for the current main SHA' >&2
            exit 1
          fi
          printf 'Deploying verified main commit %s\n' "$MAIN_SHA"

          SERVER_PORT_RAW="${SERVER_PORT_SECRET:-22}"
          SERVER_PORT="$(printf '%s' "$SERVER_PORT_RAW" | tr -d '\r\n[:space:]')"
          SERVER_PORT="${SERVER_PORT#:}"
          SERVER_PORT="${SERVER_PORT:-22}"

          if [[ ! "$SERVER_PORT" =~ ^[0-9]+$ ]]; then
            echo "Invalid SERVER_PORT value: '$SERVER_PORT_RAW'" >&2
            exit 1
          fi

          if [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]]; then
            DOCKER_ENABLED=true
          else
            DOCKER_ENABLED=false
          fi

          if [[ -n "$SERVER_HOST" && -n "$SERVER_USERNAME" && -n "$SERVER_SSH_KEY" ]]; then
            SERVER_ENABLED=true
          elif [[ -n "$SERVER_HOST" && -n "$SERVER_USERNAME" && -n "$SERVER_PASSWORD" ]]; then
            echo 'Native SSH deployment requires SERVER_SSH_KEY; password-only login is unsupported' >&2
            exit 1
          else
            SERVER_ENABLED=false
          fi

          echo "docker_enabled=$DOCKER_ENABLED" >> "$GITHUB_OUTPUT"
          echo "server_enabled=$SERVER_ENABLED" >> "$GITHUB_OUTPUT"

  desktop-installer:
    name: Desktop Installer
    needs: preflight
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind installer to verified main commit
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          python ../deploy/verify_desktop_artifact.py --directory dist/releases --package package.json \
            --source-commit "$EXPECTED_SOURCE_SHA" --manifest dist/releases/desktop-release.json

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentproject-desktop-win
          path: |
            desktop/dist/releases/Detachym-*-x64.exe
            desktop/dist/releases/desktop-release.json
          if-no-files-found: error
          retention-days: 7

  server-images:
    name: Build Verified Server Images
    needs: preflight
    if: needs.preflight.outputs.server_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEPLOY_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Build source-bound server image archive
        run: bash deploy/build_server_images.sh "$DEPLOY_SOURCE_SHA" "$RUNNER_TEMP/server-images"

      - name: Smoke test the exact server images
        run: bash deploy/smoke_server_images.sh "$DEPLOY_SOURCE_SHA"

      - name: Upload verified server image artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentproject-server-images
          path: ${{ runner.temp }}/server-images/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  docker-publish:
    name: Publish Docker Images
    needs: preflight
    if: needs.preflight.outputs.docker_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image metadata
        id: image-meta
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(python -c "from pathlib import Path; import re; content = Path('backend/app/core/config.py').read_text(encoding='utf-8'); match = re.search(r'APP_VERSION:\\s*str\\s*=\\s*\"([^\"]+)\"', content); assert match, 'APP_VERSION not found'; print(match.group(1))")"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/agentproject-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/agentproject-backend:v${{ steps.image-meta.outputs.app_version }}
            ${{ secrets.DOCKER_USERNAME }}/agentproject-backend:sha-${{ steps.image-meta.outputs.short_sha }}

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.nginx
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/agentproject-nginx:latest
            ${{ secrets.DOCKER_USERNAME }}/agentproject-nginx:v${{ steps.image-meta.outputs.app_version }}
            ${{ secrets.DOCKER_USERNAME }}/agentproject-nginx:sha-${{ steps.image-meta.outputs.short_sha }}

      - name: Build and push agent-server image
        uses: docker/build-push-action@v6
        with:
          context: ./agent-server
          file: ./agent-server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/agentproject-agent-server:latest
            ${{ secrets.DOCKER_USERNAME }}/agentproject-agent-server:v${{ steps.image-meta.outputs.app_version }}
            ${{ secrets.DOCKER_USERNAME }}/agentproject-agent-server:sha-${{ steps.image-meta.outputs.short_sha }}

  deploy-server:
    name: Deploy Server
    needs: [preflight, desktop-installer, server-images]
    if: needs.preflight.outputs.server_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SERVER_HOST_RAW: ${{ secrets.SERVER_HOST }}
      SERVER_USERNAME_RAW: ${{ secrets.SERVER_USERNAME }}
      SERVER_APP_DIR_RAW: ${{ secrets.SERVER_APP_DIR }}
      SERVER_PORT_RAW: ${{ secrets.SERVER_PORT }}
      DEPLOY_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: agentproject-desktop-win
          path: desktop-release

      - uses: actions/download-artifact@v4
        with:
          name: agentproject-server-images
          path: server-images

      - name: Verify downloaded server image archive
        run: python3 deploy/server_images.py verify --directory server-images --source-commit "$DEPLOY_SOURCE_SHA"

      - name: Verify downloaded installer and source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SOURCE_SHA"
          python3 deploy/verify_desktop_artifact.py --directory desktop-release --package desktop/package.json \
            --source-commit "$DEPLOY_SOURCE_SHA" --manifest desktop-release/desktop-release.json --verify
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('desktop-release/desktop-release.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for key in ('version', 'filename', 'bytes', 'sha256', 'sourceCommit'):
                  env.write(f"DESKTOP_ARTIFACT_{key.upper()}={release[key]}\n")
          PY

      - name: Set up SSH
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -lf ~/.ssh/id_ed25519
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve deploy target
        shell: bash
        run: |
          set -euo pipefail
          HOST_INPUT="$(printf '%s' "${SERVER_HOST_RAW:-}" | tr -d '\r\n[:space:]')"
          USERNAME="$(printf '%s' "${SERVER_USERNAME_RAW:-}" | tr -d '\r\n[:space:]')"
          APP_DIR="$(printf '%s' "${SERVER_APP_DIR_RAW:-}" | tr -d '\r')"
          APP_DIR="${APP_DIR:-/root/PersonalSpace/AgentProject}"
          PORT="$(printf '%s' "${SERVER_PORT_RAW:-22}" | tr -d '\r\n[:space:]')"
          PORT="${PORT#:}"
          PORT="${PORT:-22}"

          HOST_INPUT="${HOST_INPUT#ssh://}"
          HOST_INPUT="${HOST_INPUT#http://}"
          HOST_INPUT="${HOST_INPUT#https://}"
          HOST_INPUT="${HOST_INPUT%%/*}"
          HOST_INPUT="${HOST_INPUT##*@}"

          if [[ "$HOST_INPUT" =~ ^\[(.+)\]:(.+)$ ]]; then
            if [[ -z "${SERVER_PORT_RAW:-}" ]]; then
              PORT="${BASH_REMATCH[2]}"
            fi
            HOST="${BASH_REMATCH[1]}"
          elif [[ "$HOST_INPUT" =~ ^([^:]+):([0-9]+)$ ]]; then
            if [[ -z "${SERVER_PORT_RAW:-}" ]]; then
              PORT="${BASH_REMATCH[2]}"
            fi
            HOST="${BASH_REMATCH[1]}"
          else
            HOST="$HOST_INPUT"
          fi

          if [[ -z "$HOST" ]]; then
            echo "SERVER_HOST is empty" >&2
            exit 1
          fi
          if [[ -z "$USERNAME" ]]; then
            echo "SERVER_USERNAME is empty" >&2
            exit 1
          fi
          if [[ ! "$PORT" =~ ^[0-9]+$ ]]; then
            echo "Invalid SERVER_PORT: '${SERVER_PORT_RAW:-}'" >&2
            exit 1
          fi

          echo "DEPLOY_HOST=$HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$USERNAME" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $HOST
            User $USERNAME
            Port $PORT
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            BatchMode yes
            ConnectTimeout 30
            ServerAliveInterval 60
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config

          printf 'Deploy target: %s@%s:%s%s\n' "$USERNAME" "$HOST" "$PORT" "$APP_DIR"

      - name: Recheck main before remote changes
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$MAIN_SHA" != "$DEPLOY_SOURCE_SHA" ]]; then
            echo 'main changed while building; its new CI must finish before deployment' >&2
            exit 1
          fi

      - name: Prepare remote directories
        shell: bash
        run: |
          set -euo pipefail
          ssh deploy-target \
            "mkdir -p '$DEPLOY_APP_DIR' \
             && mkdir -p '$DEPLOY_APP_DIR/agent-server' \
             && mkdir -p '$DEPLOY_APP_DIR/data/downloads' \
             && mkdir -p '$DEPLOY_APP_DIR/data/postgres' \
             && mkdir -p '$DEPLOY_APP_DIR/data/uploads' \
             && mkdir -p '$DEPLOY_APP_DIR/data/chroma' \
             && mkdir -p '$DEPLOY_APP_DIR/logs'"

      - name: Refuse application or database downgrade
        shell: bash
        run: |
          set -euo pipefail
          ssh deploy-target "cd '$DEPLOY_APP_DIR' && docker compose exec -T backend python - --inspect-running" \
            < deploy/verify_release_transition.py > running-release.json
          python3 deploy/verify_release_transition.py running-release.json

      - name: Check server platform and disk capacity
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_BYTES="$(stat -c %s server-images/server-images.tar.gz)"
          ssh deploy-target "cd '$DEPLOY_APP_DIR' && ARCHIVE_BYTES='$ARCHIVE_BYTES' bash -s" <<'REMOTE_CAPACITY'
          set -euo pipefail
          command -v python3 >/dev/null
          test "$(docker info --format '{{.OSType}}/{{.Architecture}}')" = 'linux/x86_64'
          DOCKER_ROOT="$(docker info --format '{{.DockerRootDir}}')"
          # Reserve space for the uploaded archive and unpacked layers without pruning old images.
          REQUIRED_KIB=$(( (ARCHIVE_BYTES * 5 + 2147483648) / 1024 ))
          for directory in . "$DOCKER_ROOT"; do
            AVAILABLE_KIB="$(df -Pk "$directory" | awk 'NR==2 {print $4}')"
            if [ "$AVAILABLE_KIB" -lt "$REQUIRED_KIB" ]; then
              echo 'Insufficient disk space for a verified image load; existing releases were retained' >&2
              exit 1
            fi
          done
          REMOTE_CAPACITY

      - name: Upload committed runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/runtime_bundle.py --source-commit "$DEPLOY_SOURCE_SHA" \
            --output deploy-runtime.tgz > runtime-bundle.json
          cat runtime-bundle.json
          RUNTIME_SHA256="$(python3 -c "import json; print(json.load(open('runtime-bundle.json'))['sha256'])")"
          scp deploy-runtime.tgz "deploy-target:$DEPLOY_APP_DIR/.deploy-runtime-$DEPLOY_SOURCE_SHA.tgz"
          # Stream this checked-out verifier; do not execute files from an unchecked archive.
          ssh deploy-target \
            "cd '$DEPLOY_APP_DIR' \
             && python3 - --install '.deploy-runtime-$DEPLOY_SOURCE_SHA.tgz' \
                  --source-commit '$DEPLOY_SOURCE_SHA' --sha256 '$RUNTIME_SHA256' \
             && rm -f -- '.deploy-runtime-$DEPLOY_SOURCE_SHA.tgz'" \
            < deploy/runtime_bundle.py > runtime-install.json
          cat runtime-install.json
          rm -f -- deploy-runtime.tgz

      - name: Stage and load verified server images
        shell: bash
        run: |
          set -euo pipefail
          ssh deploy-target "mkdir -p '$DEPLOY_APP_DIR/.server-images-$DEPLOY_SOURCE_SHA'"
          scp server-images/server-images.tar.gz server-images/server-images.json \
            "deploy-target:$DEPLOY_APP_DIR/.server-images-$DEPLOY_SOURCE_SHA/"
          ssh deploy-target "cd '$DEPLOY_APP_DIR' && DEPLOY_SOURCE_SHA='$DEPLOY_SOURCE_SHA' bash -s" <<'REMOTE_IMAGES'
          set -euo pipefail
          RELEASE_DIR=".server-images-$DEPLOY_SOURCE_SHA"
          python3 deploy/server_images.py verify --directory "$RELEASE_DIR" --source-commit "$DEPLOY_SOURCE_SHA"
          docker image load --input "$RELEASE_DIR/server-images.tar.gz"
          python3 deploy/server_images.py compose --directory "$RELEASE_DIR" --source-commit "$DEPLOY_SOURCE_SHA"
          # Retain the small manifest/overrides and old images, not the uploaded tarball.
          rm -f -- "$RELEASE_DIR/server-images.tar.gz"
          REMOTE_IMAGES

      - name: Stage verified desktop download
        shell: bash
        run: |
          set -euo pipefail
          scp "desktop-release/$DESKTOP_ARTIFACT_FILENAME" \
            "deploy-target:$DEPLOY_APP_DIR/data/downloads/.$DESKTOP_ARTIFACT_FILENAME.$DEPLOY_SOURCE_SHA.upload"
          scp desktop-release/desktop-release.json \
            "deploy-target:$DEPLOY_APP_DIR/.desktop-release-$DEPLOY_SOURCE_SHA.json"

      - name: Recheck main before service switch
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$MAIN_SHA" != "$DEPLOY_SOURCE_SHA" ]]; then
            echo 'main changed during artifact transfer; refusing a stale service switch' >&2
            exit 1
          fi

      - name: Deploy on server
        shell: bash
        run: |
          set -euo pipefail
          ssh deploy-target "cd '$DEPLOY_APP_DIR' && PUBLIC_DEPLOY_HOST='$DEPLOY_HOST' DEPLOY_SOURCE_SHA='$DEPLOY_SOURCE_SHA' DESKTOP_RELEASE_VERSION='$DESKTOP_ARTIFACT_VERSION' DESKTOP_RELEASE_FILE='$DESKTOP_ARTIFACT_FILENAME' DESKTOP_RELEASE_BYTES='$DESKTOP_ARTIFACT_BYTES' DESKTOP_RELEASE_SHA256='$DESKTOP_ARTIFACT_SHA256' bash -s" <<'REMOTE_DEPLOY'
          set -euo pipefail

          if [ ! -f .env ]; then
            echo 'Missing .env' >&2
            exit 1
          fi

          read_env() {
            grep -m1 "^$1=" .env | cut -d= -f2- | tr -d '\r' || true
          }

          upsert_env() {
            key="$1"
            value="$2"
            tmp_env="$(mktemp)"
            if grep -q "^${key}=" .env; then
              awk -v key="$key" -v value="$value" '
                BEGIN { replaced = 0 }
                $0 ~ "^" key "=" {
                  print key "=" value
                  replaced = 1
                  next
                }
                { print }
                END {
                  if (!replaced) {
                    print key "=" value
                  }
                }
              ' .env > "$tmp_env"
            else
              cat .env > "$tmp_env"
              printf '%s=%s\n' "$key" "$value" >> "$tmp_env"
            fi
            mv "$tmp_env" .env
          }

          # Keep existing runtime secrets and business data. Only release keys change.
          umask 077
          if [ ! -f ".release-state-before-$DEPLOY_SOURCE_SHA.env" ]; then
            printf 'DESKTOP_RELEASE_VERSION=%s\nDESKTOP_RELEASE_FILE=%s\n' \
              "$(read_env DESKTOP_RELEASE_VERSION)" "$(read_env DESKTOP_RELEASE_FILE)" \
              > ".release-state-before-$DEPLOY_SOURCE_SHA.env"
          fi
          STAGED_INSTALLER="data/downloads/.$DESKTOP_RELEASE_FILE.$DEPLOY_SOURCE_SHA.upload"
          printf '%s  %s\n' "$DESKTOP_RELEASE_SHA256" "$STAGED_INSTALLER" | sha256sum --check --status
          test "$(stat -c %s "$STAGED_INSTALLER")" = "$DESKTOP_RELEASE_BYTES"
          if [ -e "data/downloads/$DESKTOP_RELEASE_FILE" ]; then
            printf '%s  %s\n' "$DESKTOP_RELEASE_SHA256" "data/downloads/$DESKTOP_RELEASE_FILE" | sha256sum --check --status
            rm -f -- "$STAGED_INSTALLER"
          else
            mv -- "$STAGED_INSTALLER" "data/downloads/$DESKTOP_RELEASE_FILE"
          fi

          AGENT_API_KEY="$(read_env VOLC_AGENT_API_KEY)"
          BACKEND_INTERNAL_API_KEY="$(read_env BACKEND_INTERNAL_API_KEY)"
          if [ -z "$AGENT_API_KEY" ] || [ -z "$BACKEND_INTERNAL_API_KEY" ]; then
            echo 'Missing VOLC_AGENT_API_KEY or BACKEND_INTERNAL_API_KEY in .env' >&2
            exit 1
          fi

          PUBLIC_ORIGIN="$(read_env WEB_APP_URL)"
          case "$PUBLIC_ORIGIN" in
            ""|http://localhost*|https://localhost*|http://127.0.0.1*|https://127.0.0.1*|http://0.0.0.0*|https://0.0.0.0*)
              PUBLIC_ORIGIN="https://${PUBLIC_DEPLOY_HOST}"
              ;;
          esac
          case "$PUBLIC_ORIGIN" in
            http://*) PUBLIC_ORIGIN="https://${PUBLIC_ORIGIN#http://}" ;;
          esac
          PUBLIC_ORIGIN="${PUBLIC_ORIGIN%/}"
          printf '%s\n' "$PUBLIC_ORIGIN" > ".public-origin-$DEPLOY_SOURCE_SHA"

          AGENT_CHAT_URL="$(read_env VOLC_AGENT_CHAT_COMPLETIONS_URL)"
          case "$AGENT_CHAT_URL" in
            ""|http://localhost*|https://localhost*|http://127.0.0.1*|https://127.0.0.1*|http://0.0.0.0*|https://0.0.0.0*)
              AGENT_CHAT_URL="${PUBLIC_ORIGIN}/agent/v1/chat/completions"
              upsert_env VOLC_AGENT_CHAT_COMPLETIONS_URL "$AGENT_CHAT_URL"
              ;;
          esac
          case "$AGENT_CHAT_URL" in
            https://*/v1/chat/completions) ;;
            *)
              echo "VOLC_AGENT_CHAT_COMPLETIONS_URL must be a public HTTPS /v1/chat/completions URL" >&2
              exit 1
              ;;
          esac

          printf 'AGENT_API_KEY=%s\nAGENT_LOG_LEVEL=info\nAGENT_FIRST_CHUNK_TIMEOUT_MS=8000\nAGENT_TOTAL_TIMEOUT_MS=45000\nAGENT_TOOL_TIMEOUT_MS=5000\nBACKEND_BASE_URL=http://agentproject-backend:5000\nBACKEND_INTERNAL_API_KEY=%s\n' "$AGENT_API_KEY" "$BACKEND_INTERNAL_API_KEY" > agent-server/.env

          upsert_env DESKTOP_RELEASE_VERSION "$DESKTOP_RELEASE_VERSION"
          upsert_env DESKTOP_RELEASE_FILE "$DESKTOP_RELEASE_FILE"
          command -v docker >/dev/null
          export COMPOSE_PROGRESS=plain
          IMAGE_RELEASE_DIR="$PWD/.server-images-$DEPLOY_SOURCE_SHA"
          # Recheck immutable image IDs immediately before switching containers.
          python3 deploy/server_images.py inspect --directory "$IMAGE_RELEASE_DIR" --source-commit "$DEPLOY_SOURCE_SHA"
          python3 deploy/server_images.py activate --directory "$IMAGE_RELEASE_DIR" \
            --source-commit "$DEPLOY_SOURCE_SHA" --project-directory "$PWD"
          docker compose -f docker-compose.yml -f "$IMAGE_RELEASE_DIR/main.compose.json" \
            up -d --no-build --pull never --remove-orphans
          cd agent-server
          docker compose -f docker-compose.yml -f "$IMAGE_RELEASE_DIR/agent.compose.json" \
            up -d --no-build --pull never --remove-orphans
          cd ..

          for attempt in 1 2 3 4 5 6; do
            # This command must not consume the remaining remote bash script.
            if docker compose exec -T --interactive=false backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/ready')" </dev/null; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo 'Post-deploy readiness checks failed' >&2
              exit 1
            fi
            sleep 5
          done

          for attempt in 1 2 3 4 5 6; do
            if curl -fsS http://127.0.0.1:8001/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo 'Agent-server readiness checks failed' >&2
              exit 1
            fi
            sleep 5
          done

          docker compose ps
          python3 deploy/server_images.py inspect --directory "$IMAGE_RELEASE_DIR" \
            --source-commit "$DEPLOY_SOURCE_SHA" --running > "$IMAGE_RELEASE_DIR/running-images.json"
          REMOTE_DEPLOY

      - name: Download running image provenance
        shell: bash
        run: |
          set -euo pipefail
          scp "deploy-target:$DEPLOY_APP_DIR/.server-images-$DEPLOY_SOURCE_SHA/running-images.json" running-images.json
          cat running-images.json

      - name: Verify public release and download
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_ORIGIN="$(ssh deploy-target "cd '$DEPLOY_APP_DIR' && cat '.public-origin-$DEPLOY_SOURCE_SHA'")"
          for attempt in 1 2 3 4 5 6; do
            if python3 deploy/verify_desktop_artifact.py --directory desktop-release --package desktop/package.json \
              --source-commit "$DEPLOY_SOURCE_SHA" --manifest desktop-release/desktop-release.json --verify \
              --public-base-url "$PUBLIC_ORIGIN" > public-release-verification.json; then
              cat public-release-verification.json
              break
            fi
            if [[ "$attempt" -eq 6 ]]; then
              cat public-release-verification.json
              exit 1
            fi
            sleep 5
          done
          ssh deploy-target "cd '$DEPLOY_APP_DIR' && mv '.desktop-release-$DEPLOY_SOURCE_SHA.json' .deployed-release.json"

      - name: Upload release provenance and public verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-release-verification
          path: |
            desktop-release/desktop-release.json
            public-release-verification.json
            running-release.json
            running-images.json
            server-images/server-images.json
            runtime-bundle.json
            runtime-install.json
          if-no-files-found: warn
