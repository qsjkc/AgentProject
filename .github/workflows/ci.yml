name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-image-check:
    name: Server Image Build and Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify immutable server images
        shell: bash
        run: bash deploy/build_server_images.sh "$(git rev-parse HEAD)" "$RUNNER_TEMP/server-images"
      - name: Load and inspect the verified image archive
        shell: bash
        run: |
          set -euo pipefail
          docker image load --input "$RUNNER_TEMP/server-images/server-images.tar.gz"
          python3 deploy/server_images.py inspect --directory "$RUNNER_TEMP/server-images" --source-commit "$(git rev-parse HEAD)"
      - name: Smoke isolated server images
        shell: bash
        run: bash deploy/smoke_server_images.sh "$(git rev-parse HEAD)"
      - name: Upload server image provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-image-verification
          path: ${{ runner.temp }}/server-images/server-images.json
          if-no-files-found: warn
          retention-days: 7

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite+aiosqlite:///./tests/.runtime/test.db
      CHROMA_PERSIST_DIR: ./tests/.runtime/chroma
      UPLOAD_DIR: ./tests/.runtime/uploads
      DOWNLOAD_DIR: ./tests/.runtime/downloads
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_EMAIL: admin@example.com
      INITIAL_ADMIN_PASSWORD: ChangeThisPassword123!
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare runtime directories
        run: |
          mkdir -p tests/.runtime/chroma
          mkdir -p tests/.runtime/uploads
          mkdir -p tests/.runtime/downloads

      - name: Run backend tests
        run: pytest -q -p no:cacheprovider tests

      - name: Test deployment version guard
        run: python -m unittest discover -s ../deploy -p "test_*.py"

      - name: Verify PostgreSQL migrations, services and restore
        run: python scripts/verify_postgres_release.py --report ../P1L-postgres-verification.json

      - name: Upload PostgreSQL verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-release-verification
          path: P1L-postgres-verification.json

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Build web portal
        run: npm run build

  agent-server-tests:
    name: Agent Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    defaults:
      run:
        working-directory: agent-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent-server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agent-server tests
        run: pytest -q -p no:cacheprovider

  desktop-renderer-check:
    name: Desktop Renderer Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run desktop tests
        run: npm run test

      - name: Test release baseline checker
        run: npm run test:release-baseline

      - name: Build renderer
        run: npm run build:renderer

  desktop-e2e:
    name: Windows Electron E2E (stub and real backend)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Prepare isolated backend runtime
        run: |
          python -m venv ../backend/venv
          ../backend/venv/Scripts/python.exe -m pip install -r ../backend/requirements.txt
      - run: npm ci
      - name: Build web registration for real backend acceptance
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          npm ci
          npm run build
      - run: npm run test:e2e:runner
      - run: npm run build:renderer
      - run: npm run test:e2e
      - run: npm run pack
      - run: npm run test:packaged
      - run: npm run test:packaged:real-backend
      - name: Upload Electron evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e
          path: desktop/artifacts/e2e/
          retention-days: 7
