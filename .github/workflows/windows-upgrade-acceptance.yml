name: Windows Upgrade Acceptance

on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: Main CD run that deployed the baseline
        type: string
        required: true
      baseline_artifact_id:
        description: Immutable installer artifact ID for the baseline
        type: string
        required: true
      candidate_run_id:
        description: Main CD run that built the candidate
        type: string
        required: true
      candidate_artifact_id:
        description: Immutable installer artifact ID for the candidate
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  verify-upgrade:
    name: Verify Windows in-place upgrade
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify both CD artifacts and download exact archives
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          BASELINE_ARTIFACT_ID: ${{ inputs.baseline_artifact_id }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'detachym-upgrade-acceptance'
          $reports = Join-Path $root 'evidence'
          New-Item -Path $reports -ItemType Directory -Force | Out-Null
          $report = [ordered]@{ status = 'running'; workflowRunId = $env:GITHUB_RUN_ID }
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }

          function Resolve-Installer([string]$Role, [string]$RunId, [string]$ArtifactId) {
            foreach ($id in @($RunId, $ArtifactId)) {
              if ($id -cnotmatch '\A[1-9][0-9]{0,18}\z') { throw "$Role requires positive decimal run and artifact IDs" }
            }

            $run = Invoke-RestMethod -Uri "$api/runs/$RunId" -Headers $headers -TimeoutSec 30
            if ([string]$run.id -cne $RunId -or $run.path -cne '.github/workflows/cd.yml' -or
                $run.head_branch -cne 'main' -or $run.event -cnotin @('workflow_run', 'workflow_dispatch') -or
                $run.repository.full_name -cne $env:GITHUB_REPOSITORY -or
                $run.head_repository.full_name -cne $env:GITHUB_REPOSITORY -or $run.head_sha -cnotmatch '\A[a-f0-9]{40}\z') {
              throw "$Role run $RunId is not a main CD run in this repository"
            }

            $artifact = Invoke-RestMethod -Uri "$api/artifacts/$ArtifactId" -Headers $headers -TimeoutSec 30
            if ([string]$artifact.id -cne $ArtifactId -or $artifact.name -cne 'agentproject-desktop-win' -or
                $artifact.expired -ne $false -or $artifact.digest -cnotmatch '\Asha256:[a-f0-9]{64}\z' -or
                [string]$artifact.workflow_run.id -cne $RunId -or $artifact.workflow_run.head_branch -cne 'main' -or
                $artifact.workflow_run.repository_id -ne $run.repository.id -or
                $artifact.workflow_run.head_repository_id -ne $run.head_repository.id -or
                $artifact.workflow_run.head_sha -cne $run.head_sha) {
              throw "$Role artifact $ArtifactId is not an available installer for main CD run $RunId"
            }

            $jobs = (Invoke-RestMethod -Uri "$api/runs/$RunId/jobs?filter=latest&per_page=100" -Headers $headers -TimeoutSec 30).jobs
            $builder = @($jobs | Where-Object { $_.name -ceq 'Desktop Installer' -and $_.conclusion -ceq 'success' })
            $createdAt = [DateTimeOffset]$artifact.created_at
            if ($builder.Count -ne 1 -or $createdAt -lt [DateTimeOffset]$builder[0].started_at -or
                $createdAt -gt [DateTimeOffset]$builder[0].completed_at) {
              throw "$Role artifact $ArtifactId was not produced by the successful Desktop Installer job in run $RunId"
            }
            $deploymentJobId = $null
            if ($Role -ceq 'baseline') {
              $deployment = @($jobs | Where-Object { $_.name -ceq 'Deploy Server' -and $_.conclusion -ceq 'success' })
              $publicCheck = @($deployment.steps | Where-Object { $_.name -ceq 'Verify public release and download' -and $_.conclusion -ceq 'success' })
              if ($deployment.Count -ne 1 -or $publicCheck.Count -ne 1) {
                throw "Baseline run $RunId did not deploy and verify the public release"
              }
              $deploymentJobId = $deployment[0].id
            }

            return [ordered]@{
              role = $Role
              runId = $RunId
              artifactId = $ArtifactId
              sourceCommit = $run.head_sha
              archiveSha256 = $artifact.digest.Substring(7)
              builderJobId = $builder[0].id
              deploymentJobId = $deploymentJobId
            }
          }

          try {
            $report.baseline = Resolve-Installer 'baseline' $env:BASELINE_RUN_ID $env:BASELINE_ARTIFACT_ID
            $report.candidate = Resolve-Installer 'candidate' $env:CANDIDATE_RUN_ID $env:CANDIDATE_ARTIFACT_ID
            git merge-base --is-ancestor $report.baseline.sourceCommit $report.candidate.sourceCommit
            if ($LASTEXITCODE -ne 0 -or $report.baseline.sourceCommit -ceq $report.candidate.sourceCommit) {
              throw 'The baseline must be a strict ancestor of the candidate commit'
            }

            foreach ($artifact in @($report.baseline, $report.candidate)) {
              $archive = Join-Path $root "$($artifact.role).zip"
              Invoke-WebRequest -Uri "$api/artifacts/$($artifact.artifactId)/zip" -Headers $headers -OutFile $archive -TimeoutSec 180
              $archiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
              if ($archiveHash -cne $artifact.archiveSha256) { throw "Archive digest mismatch for $($artifact.role) artifact $($artifact.artifactId)" }
              Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $root $artifact.role)
            }
            $report.status = 'passed'
          }
          catch {
            $report.status = 'failed'
            $report.error = $_.Exception.Message
            throw
          }
          finally {
            $report | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $reports 'github-artifacts.json') -Encoding UTF8
          }

      - name: Install baseline and upgrade in place
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'detachym-upgrade-acceptance'
          $reports = Join-Path $root 'evidence'
          $sources = Get-Content -Raw -LiteralPath (Join-Path $reports 'github-artifacts.json') | ConvertFrom-Json
          & ./.github/acceptance/verify-windows-upgrade.ps1 `
            -BaselineDirectory (Join-Path $root 'baseline') -BaselineSourceCommit $sources.baseline.sourceCommit `
            -CandidateDirectory (Join-Path $root 'candidate') -CandidateSourceCommit $sources.candidate.sourceCommit `
            -ReportDirectory $reports

      - name: Upload Windows upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-upgrade-evidence
          path: ${{ runner.temp }}/detachym-upgrade-acceptance/evidence/*.json
          if-no-files-found: warn
          retention-days: 30
